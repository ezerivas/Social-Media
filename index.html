<!DOCTYPE html>
<html>
<head>
  <title>Inbox</title>
  <style>
    body { font-family: Arial; display: flex; height: 100vh; margin: 0; }
    #conversations { width: 30%; border-right: 1px solid #ccc; overflow-y: auto; }
    #messages { width: 70%; display: flex; flex-direction: column; }
    .conv { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    .conv:hover { background: #f0f0f0; }
    #chat { flex: 1; padding: 10px; overflow-y: auto; }
    #inputBox { display: flex; border-top: 1px solid #ccc; }
    #msgInput { flex: 1; padding: 10px; border: none; }
    button { padding: 10px; border: none; background: #007bff; color: white; }
  </style>
</head>

<body>

<div id="conversations"></div>

<div id="messages">
  <div id="chat"></div>

  <div id="inputBox">
    <input id="msgInput" placeholder="Escribí un mensaje..." />
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
const API = "https://TU-APP.up.railway.app";

let currentConversation = null;
let currentUserExternalId = null;


// 🔹 cargar conversaciones
async function loadConversations() {
  const res = await fetch(`${API}/conversations`);
  const data = await res.json();

  const container = document.getElementById("conversations");
  container.innerHTML = "";

  data.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv";

    div.innerHTML = `
      <b>Usuario ${c.user_id}</b><br>
      ${c.last_message || ""}
    `;

    div.onclick = () => {
      currentConversation = c.id;
      currentUserExternalId = c.external_id;
      loadMessages(c.id);
    };

    container.appendChild(div);
  });
}


// 🔹 cargar mensajes
async function loadMessages(id) {
  const res = await fetch(`${API}/conversations/${id}/messages`);
  const data = await res.json();

  const container = document.getElementById("chat");
  container.innerHTML = "";

  data.forEach(m => {
    const div = document.createElement("div");

    div.innerHTML = `<b>${m.sender === "agent" ? "Yo" : "Cliente"}:</b> ${m.text}`;

    container.appendChild(div);
  });

  container.scrollTop = container.scrollHeight;
}


// 🔹 enviar mensaje
async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value;

  if (!text || !currentUserExternalId) return;

  await fetch(`${API}/send`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      recipient_id: currentUserExternalId,
      text
    })
  });

  input.value = "";

  loadMessages(currentConversation);
}


// 🔹 auto refresh
setInterval(() => {
  if (currentConversation) {
    loadMessages(currentConversation);
  }
}, 3000);


// init
loadConversations();
</script>

</body>
</html>
