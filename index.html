<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h2>Conversaciones</h2>
<ul id="conversations"></ul>

<h2>Mensajes</h2>
<ul id="messages"></ul>

<input id="text" placeholder="Escribir mensaje">
<button onclick="sendMessage()">Enviar</button>

<script>
let currentConversation = null;
let currentUser = null;
let ws = null;

async function loadConversations() {
    const res = await fetch('/conversations');
    const data = await res.json();

    const list = document.getElementById('conversations');
    list.innerHTML = '';

    data.forEach(c => {
        const li = document.createElement('li');
        li.innerText = c.user_name || c.user_external_id;

        li.onclick = () => {
            currentConversation = c.id;
            currentUser = c.user_external_id;

            connectWebSocket();
            loadMessages();
        };

        list.appendChild(li);
    });
}

function connectWebSocket() {
    if (ws) {
        ws.close();
    }

    const protocol = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${protocol}://${location.host}/ws/${currentConversation}`);

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "new_message") {
            loadMessages();
        }
    };
}

async function loadMessages() {
    if (!currentConversation) return;

    const res = await fetch(`/conversations/${currentConversation}/messages`);
    const data = await res.json();

    const list = document.getElementById('messages');
    list.innerHTML = '';

    data.forEach(m => {
        const li = document.createElement('li');
        li.innerText = `${m.role}: ${m.content}`;
        list.appendChild(li);
    });
}

async function sendMessage() {
    const textInput = document.getElementById('text');
    const text = textInput.value;

    if (!text || !currentConversation) return;

    await fetch('/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            recipient_id: currentUser,
            text: text,
            conversation_id: currentConversation
        })
    });

    textInput.value = '';
}

loadConversations();
</script>

</body>
</html>
