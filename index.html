<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h2>Conversaciones</h2>
<ul id="conversations"></ul>

<h2>Mensajes</h2>
<ul id="messages"></ul>

<input id="text" placeholder="Escribir mensaje">
<button onclick="sendMessage()">Enviar</button>

<script>
let currentConversation = null;
let currentUser = null;

// cargar conversaciones
async function loadConversations() {
    const res = await fetch('/conversations');
    const data = await res.json();

    const list = document.getElementById('conversations');
    list.innerHTML = '';

    data.forEach(c => {
        const li = document.createElement('li');
        li.innerText = c.name || c.external_id;

        li.onclick = () => {
            currentConversation = c.id;
            currentUser = c.external_id;
            loadMessages();
        };

        list.appendChild(li);
    });
}

// cargar mensajes
async function loadMessages() {
    const res = await fetch(`/conversations/${currentConversation}/messages`);
    const data = await res.json();

    const list = document.getElementById('messages');
    list.innerHTML = '';

    data.forEach(m => {
        const li = document.createElement('li');
        li.innerText = `${m.sender}: ${m.text}`;
        list.appendChild(li);
    });
}

// enviar mensaje
async function sendMessage() {
    const text = document.getElementById('text').value;

    await fetch('/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            recipient_id: currentUser,
            text: text
        })
    });

    loadMessages();
}

// auto refresh
setInterval(loadConversations, 3000);

loadConversations();
</script>

</body>
</html>
