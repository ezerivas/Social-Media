<script>
let currentConversation = null;
let currentUser = null;

async function loadConversations() {
    const res = await fetch('/conversations');
    const data = await res.json();

    const list = document.getElementById('conversations');
    list.innerHTML = '';

    data.forEach(c => {
        const li = document.createElement('li');
        li.innerText = c.user_name || c.user_external_id;

        li.onclick = () => {
            currentConversation = c.id;
            currentUser = c.user_external_id;
            loadMessages();
        };

        list.appendChild(li);
    });
}

async function loadMessages() {
    const res = await fetch(`/conversations/${currentConversation}/messages`);
    const data = await res.json();

    const list = document.getElementById('messages');
    list.innerHTML = '';

    data.forEach(m => {
        const li = document.createElement('li');
        li.innerText = `${m.role}: ${m.content}`;
        list.appendChild(li);
    });
}

async function sendMessage() {
    const text = document.getElementById('text').value;

    await fetch('/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            recipient_id: currentUser,
            text: text
        })
    });

    loadMessages();
}

setInterval(loadConversations, 3000);
loadConversations();
</script>
