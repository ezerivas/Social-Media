<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>

<body>

<h2>Conversaciones</h2>
<ul id="conversations"></ul>

<h2>Mensajes</h2>
<ul id="messages"></ul>

<input id="text" placeholder="Escribir mensaje">
<button onclick="sendMessage()">Enviar</button>

<script>
let currentConversation = null;
let currentUser = null;

async function loadConversations() {
    const res = await fetch('/conversations');
    const data = await res.json();

    const list = document.getElementById('conversations');
    if (!list) return;

    list.innerHTML = '';

    data.forEach(c => {
        const li = document.createElement('li');
        li.innerText = c.user_name || c.user_external_id;

        li.onclick = () => {
            currentConversation = c.id;
            currentUser = c.user_external_id;
            loadMessages();
        };

        list.appendChild(li);
    });
}

async function loadMessages() {
    if (!currentConversation) return;

    const res = await fetch(`/conversations/${currentConversation}/messages`);
    const data = await res.json();

    const list = document.getElementById('messages');
    if (!list) return;

    list.innerHTML = '';

    data.forEach(m => {
        const li = document.createElement('li');
        li.innerText = `${m.role}: ${m.content}`;
        list.appendChild(li);
    });
}

async function sendMessage() {
    const textInput = document.getElementById('text');
    if (!textInput || !currentUser) return;

    const text = textInput.value;

    await fetch('/send', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            recipient_id: currentUser,
            text: text
        })
    });

    textInput.value = '';
    loadMessages();
}

// 👇 IMPORTANTE: esperar DOM listo
document.addEventListener("DOMContentLoaded", () => {
    loadConversations();
    setInterval(loadConversations, 3000);
});
</script>

</body>
</html>
