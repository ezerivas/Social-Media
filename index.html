<!DOCTYPE html>
<html>
<body>

<ul id="conversations"></ul>
<ul id="messages"></ul>

<input id="text">
<button onclick="send()">send</button>

<script>
let ws = null
let current = null

async function load() {
    const res = await fetch('/conversations')
    const data = await res.json()

    const ul = document.getElementById('conversations')
    ul.innerHTML = ''

    data.forEach(c => {
        const li = document.createElement('li')
        li.innerText = c.user_external_id

        li.onclick = () => openConv(c.id)
        ul.appendChild(li)
    })
}

async function openConv(id) {
    current = id

    const res = await fetch(`/conversations/${id}/messages`)
    const data = await res.json()

    const ul = document.getElementById('messages')
    ul.innerHTML = ''

    data.forEach(m => {
        const li = document.createElement('li')
        li.innerText = m.role + ": " + m.content
        ul.appendChild(li)
    })

    if (ws) ws.close()

    ws = new WebSocket(`wss://${location.host}/ws/${id}`)

    ws.onmessage = e => {
        const m = JSON.parse(e.data)

        const li = document.createElement('li')
        li.innerText = m.role + ": " + m.content

        document.getElementById('messages').appendChild(li)
    }
}

function send() {
    const text = document.getElementById('text').value

    ws.send(JSON.stringify({
        type: "message",
        text: text
    }))
}

load()
</script>

</body>
</html>
