<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inbox</title>
</head>
<body>

<h2>Conversaciones</h2>
<ul id="conversations"></ul>

<hr>

<h2>Mensajes</h2>
<ul id="messages"></ul>

<input type="text" id="messageInput" placeholder="Escribí un mensaje">
<button onclick="sendMessage()">Enviar</button>

<script>
let currentConversationId = null;
let currentRecipientId = null;
let ws = null;


// 🔹 abrir websocket por conversación (room)
function openSocket(conversationId) {
  if (ws) ws.close();

  const protocol = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${protocol}://${location.host}/ws/${conversationId}`);

  ws.onmessage = () => {
    loadMessages(); // actualizar mensajes en tiempo real
  };
}


// 🔹 cargar conversaciones
async function loadConversations() {
  const res = await fetch("/conversations");
  const data = await res.json();

  const list = document.getElementById("conversations");
  list.innerHTML = "";

  data.forEach(conv => {
    const li = document.createElement("li");

    // mostrar nombre del usuario
    li.textContent = `${conv.name} (ID: ${conv.external_id})`;

    // seleccionar conversación
    li.onclick = () => {
      currentConversationId = conv.id;
      currentRecipientId = conv.external_id;

      openSocket(conv.id); // 🔥 clave
      loadMessages();
    };

    list.appendChild(li);
  });
}


// 🔹 cargar mensajes
async function loadMessages() {
  if (!currentConversationId) return;

  const res = await fetch(`/conversations/${currentConversationId}/messages`);
  const data = await res.json();

  const list = document.getElementById("messages");
  list.innerHTML = "";

  data.forEach(msg => {
    const li = document.createElement("li");

    li.textContent = `[${msg.sender}] ${msg.text}`;

    list.appendChild(li);
  });
}


// 🔹 enviar mensaje
async function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value;

  if (!text || !currentRecipientId) return;

  await fetch("/send", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      recipient_id: currentRecipientId,
      text: text
    })
  });

  input.value = "";

  loadMessages(); // actualización inmediata
}


// 🔹 carga inicial
loadConversations();
</script>

</body>
</html>
