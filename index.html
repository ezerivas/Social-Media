<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h2>Conversaciones</h2>
<ul id="conversations"></ul>

<h2>Mensajes</h2>
<ul id="messages"></ul>

<input id="text" placeholder="Escribir mensaje">
<button onclick="sendMessage()">Enviar</button>

<script>
let currentConversation = null;
let currentUser = null;
let ws = null;


// ---------- CONVERSACIONES ----------
async function loadConversations() {
    const res = await fetch('/conversations');
    const data = await res.json();

    const list = document.getElementById('conversations');
    if (!list) return;

    list.innerHTML = '';

    data.forEach(c => {
        const li = document.createElement('li');
        li.innerText = c.user_name || c.user_external_id;

        li.onclick = () => {
            currentConversation = c.id;
            currentUser = c.user_external_id;
            loadMessages();
        };

        list.appendChild(li);
    });
}


// ---------- MENSAJES ----------
async function loadMessages() {
    const res = await fetch(`/conversations/${currentConversation}/messages`);
    const data = await res.json();

    const list = document.getElementById('messages');
    list.innerHTML = '';

    data.forEach(m => {
        const li = document.createElement('li');
        li.innerText = `${m.role}: ${m.content}`;
        list.appendChild(li);
    });

    // 🔥 conectar WS
    if (ws) ws.close();
    connectWS();
}


// ---------- WEBSOCKET ----------
function connectWS() {
    ws = new WebSocket(`wss://${location.host}/ws/${currentConversation}`);

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        const list = document.getElementById('messages');

        const li = document.createElement('li');
        li.innerText = `${msg.role}: ${msg.content}`;

        list.appendChild(li);
    };
}


// ---------- ENVIAR ----------
function sendMessage() {
    const text = document.getElementById('text').value;

    if (!ws) {
        alert("Seleccioná una conversación primero");
        return;
    }

    ws.send(JSON.stringify({
        type: "message",
        text: text
    }));

    document.getElementById('text').value = '';
}


// ---------- AUTO REFRESH ----------
setInterval(loadConversations, 3000);
loadConversations();
</script>

</body>
</html>
