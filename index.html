<!DOCTYPE html>
<html>
<head>
  <title>Inbox</title>
  <style>
    body { font-family: Arial; display: flex; }
    #conversations { width: 30%; border-right: 1px solid #ccc; padding: 10px; }
    #messages { width: 70%; padding: 10px; }
    .conv { cursor: pointer; padding: 5px; border-bottom: 1px solid #eee; }
    .conv:hover { background: #f0f0f0; }
  </style>
</head>
<body>

<div id="conversations"></div>
<div id="messages"></div>

<script>
const API = "https://social-media-production-0ef2.up.railway.app/"; // 👈 cambiar esto

async function loadConversations() {
  const res = await fetch(API + "/conversations");
  const data = await res.json();

  const container = document.getElementById("conversations");
  container.innerHTML = "";

  data.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv";
    div.innerHTML = `
      <b>Usuario ${c.user_id}</b><br>
      ${c.last_message || ""}
    `;

    div.onclick = () => loadMessages(c.id);

    container.appendChild(div);
  });
}

async function loadMessages(id) {
  const res = await fetch(API + `/conversations/${id}/messages`);
  const data = await res.json();

  const container = document.getElementById("messages");
  container.innerHTML = "";

  data.forEach(m => {
    const div = document.createElement("div");
    div.innerHTML = `<b>${m.sender}:</b> ${m.text}`;
    container.appendChild(div);
  });
}

loadConversations();
</script>

</body>
</html>
